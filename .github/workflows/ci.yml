name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 代码格式检查
        run: test -z "$(gofmt -s -l .)"

      - name: 代码静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 构建二进制文件
        run: make build
