name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: 创建发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Go 环境
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: 构建多平台二进制文件
        run: |
          make build-linux
          make build-windows
          make build-darwin

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vsftp-exporter-linux-amd64
            vsftp-exporter-windows-amd64.exe
            vsftp-exporter-darwin-amd64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
