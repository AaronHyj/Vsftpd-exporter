name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 创建发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建多平台二进制文件
        run: make build-all VERSION=${{ steps.version.outputs.VERSION }}

      - name: 打包 Linux
        run: |
          dir="vsftp-exporter-linux-amd64"
          mkdir -p "${dir}/configs"
          cp vsftp-exporter-linux-amd64 "${dir}/vsftp-exporter"
          cp configs/config.example.json "${dir}/configs/"
          cp -r deploy "${dir}/deploy"
          tar czf "${dir}.tar.gz" "${dir}"

      - name: 打包 Windows
        run: |
          dir="vsftp-exporter-windows-amd64"
          mkdir -p "${dir}/configs"
          cp vsftp-exporter-windows-amd64.exe "${dir}/vsftp-exporter.exe"
          cp configs/config.example.json "${dir}/configs/"
          cp -r deploy "${dir}/deploy"
          tar czf "${dir}.tar.gz" "${dir}"

      - name: 打包 macOS
        run: |
          dir="vsftp-exporter-darwin-amd64"
          mkdir -p "${dir}/configs"
          cp vsftp-exporter-darwin-amd64 "${dir}/vsftp-exporter"
          cp configs/config.example.json "${dir}/configs/"
          cp -r deploy "${dir}/deploy"
          tar czf "${dir}.tar.gz" "${dir}"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vsftp-exporter-linux-amd64.tar.gz
            vsftp-exporter-windows-amd64.tar.gz
            vsftp-exporter-darwin-amd64.tar.gz
