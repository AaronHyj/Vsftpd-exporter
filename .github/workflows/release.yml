name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 创建发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建多平台二进制文件
        run: make build-all VERSION=${{ steps.version.outputs.VERSION }}

      - name: 打包发布文件
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for pair in "linux-amd64:" "windows-amd64:.exe" "darwin-amd64:"; do
            platform="${pair%%:*}"
            ext="${pair#*:}"
            pkg="vsftp-exporter-${VERSION}-${platform}"
            mkdir -p "${pkg}/configs" "${pkg}/deploy"
            cp "vsftp-exporter-${platform}${ext}" "${pkg}/vsftp-exporter${ext}"
            cp configs/config.example.json "${pkg}/configs/"
            cp -r deploy/* "${pkg}/deploy/"
            tar czf "${pkg}.tar.gz" "${pkg}"
          done

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: vsftp-exporter-*.tar.gz
